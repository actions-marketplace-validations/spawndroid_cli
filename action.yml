name: SpawnDroid Android tests
description: >-
  Upload an APK, boot a live Android device, run your test command against it,
  and record the result along with the logcat and screen recording.
author: SpawnDroid

branding:
  icon: smartphone
  color: green

# Runs the four-call CI flow (upload → session → test → report) as one step.
# It owns the session, so the pass/fail it records is the outcome of the step
# itself — which is why it uses the per-run sessions API rather than the stable
# hub. Use the hub (`/wd/hub`) when you drive WebDriver yourself and manage the
# session lifecycle in your own framework.

inputs:
  api-key:
    description: SpawnDroid API key with the `upload` scope. Store it as a secret.
    required: true
  command:
    description: >-
      The test command to run. It receives SPAWNDROID_WD_URL, SPAWNDROID_UDID,
      SPAWNDROID_APP_PACKAGE, SPAWNDROID_APP and SPAWNDROID_SESSION_ID.
    required: true
  api-url:
    description: Console origin.
    required: false
    default: https://app.spawndroid.io
  app-path:
    description: Path to the APK to upload. Omit when reusing an existing app via `app-slug`.
    required: false
  app-slug:
    description: An already-uploaded app slug, to skip the upload step.
    required: false
  profile:
    description: Device profile id, e.g. `android-14-phone`.
    required: false
  report-path:
    description: >-
      Path to a JUnit XML report to attach to the run (e.g. junit.xml). It is
      parsed and its failures are shown on the run page.
    required: false
  ready-timeout:
    description: >-
      Seconds to wait for the device to become ready. The host's own boot and
      install timeouts add up to ~420s, so the default leaves headroom for a
      cold image.
    required: false
    default: "600"

outputs:
  session-id:
    description: The SpawnDroid session id for this run.
    value: ${{ steps.run.outputs.session-id }}
  run-url:
    description: Link to the run in the console.
    value: ${{ steps.run.outputs.run-url }}
  result:
    description: '"passed" or "failed".'
    value: ${{ steps.run.outputs.result }}
  app-slug:
    description: The app slug the tests ran against.
    value: ${{ steps.run.outputs.app-slug }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: bash "${{ github.action_path }}/run.sh"
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_APP_PATH: ${{ inputs.app-path }}
        INPUT_APP_SLUG: ${{ inputs.app-slug }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_READY_TIMEOUT: ${{ inputs.ready-timeout }}
